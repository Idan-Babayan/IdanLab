<!-- Active Directory chip glyph, drawn for the site: a solid root over three children, the one-to-many
     shape of a directory. Same family as the callout glyphs (24 grid, 2-unit lines, sharp joins). The
     viewBox is cropped to the ink by convex-hull area for the 15px .wm-ico box (CORE_SPEC section 7):
     sparser than a circle, it clamps at the 15px cap across, as htb.svg does.
     Inlined via ?raw + set:html; aria-hidden keeps the chip's accessible name to its label. No <style>,
     class or id: an inlined SVG's styles and ids are document-scoped. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 1.25 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter" stroke-linecap="butt" aria-hidden="true">
<path fill="currentColor" stroke="none" d="M9 2.5h6v6H9z"/>
<path d="M12 8.5v8M4 12.5h16M4 11.5V17M20 11.5V17"/>
<path d="M2 17h4v4H2zM10 17h4v4h-4zM18 17h4v4h-4z"/>
</svg>
